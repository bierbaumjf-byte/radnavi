<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Gezeichneter Radfahrer auf einem Tourenrad">
  <title>Jans Super Fahrrad Navi</title>

  <!-- Farben einmal oben, damit sich die Figur leicht umfärben lässt.
       Keine CSS-Variablen: die Datei wird als <img> geladen und kommt
       dann nicht an die Farben der Seite heran. -->
  <defs>
    <style>
      .haut   { fill: #f3cba6; }
      .haar   { fill: #9aa3a8; }
      .helm   { fill: #e00f1c; }
      .trikot { fill: #f6c445; }
      .hose   { fill: #2d3b47; }
      .rahmen { fill: none; stroke: #1b3a2a; stroke-width: 7;
                stroke-linecap: round; stroke-linejoin: round; }
      .reifen { fill: none; stroke: #2d3b47; stroke-width: 8; }
      .speiche{ fill: none; stroke: #b9c0c5; stroke-width: 2; }
      .linie  { fill: none; stroke: #1b3a2a; stroke-width: 5;
                stroke-linecap: round; stroke-linejoin: round; }
      /* Gliedmaßen bekommen eigene Farben. Wichtig: NICHT über .linie,
         denn eine Klasse im Stylesheet schlägt das Attribut stroke="…"
         am Element – die Beine wären sonst rahmengrün und unsichtbar. */
      .glied  { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wusch  { fill: none; stroke: #7fa88c; stroke-width: 5; stroke-linecap: round; }
      .gruen  { fill: #7fa88c; }
    </style>
  </defs>

  <!-- Hügel und Bäumchen, damit es nach Landstraße aussieht -->
  <path class="gruen" opacity=".35"
        d="M0 258 q 60 -30 120 -8 t 120 -4 t 160 10 V300 H0 Z"/>
  <g class="gruen" opacity=".55">
    <path d="M38 252 l 14 -34 14 34 Z"/>
    <rect x="49" y="250" width="4" height="10"/>
    <path d="M330 250 l 16 -38 16 38 Z"/>
    <rect x="344" y="248" width="4" height="12"/>
  </g>

  <!-- Fahrtwind -->
  <g class="wusch" opacity=".8">
    <path d="M18 150 h 46"/>
    <path d="M6 176 h 32"/>
    <path d="M24 202 h 40"/>
  </g>

  <!-- Das Rad -->
  <g>
    <!-- Hinterrad -->
    <circle class="reifen" cx="118" cy="214" r="46"/>
    <g class="speiche">
      <path d="M118 168 V260 M72 214 H164 M85 181 L151 247 M151 181 L85 247"/>
    </g>
    <!-- Vorderrad -->
    <circle class="reifen" cx="292" cy="214" r="46"/>
    <g class="speiche">
      <path d="M292 168 V260 M246 214 H338 M259 181 L325 247 M325 181 L259 247"/>
    </g>

    <!-- Rahmen: Sattelrohr, Unterrohr, Oberrohr, Hinterbau, Gabel -->
    <path class="rahmen" d="M118 214 L172 214 L196 150 L150 150 Z"/>
    <path class="rahmen" d="M196 150 L172 214"/>
    <path class="rahmen" d="M150 150 L196 150"/>
    <path class="rahmen" d="M196 150 L292 214"/>
    <path class="rahmen" d="M150 150 L138 128"/>

    <!-- Lenker mit Griff -->
    <path class="linie" d="M196 150 L214 110"/>
    <path class="linie" d="M198 104 q 16 -4 30 8"/>
    <rect x="222" y="106" width="18" height="9" rx="4" class="hose" transform="rotate(26 231 110)"/>
    <!-- Sattel -->
    <path class="hose" d="M120 120 h 40 a 8 8 0 0 1 0 14 h -40 a 8 8 0 0 1 0 -14 Z"/>
    <path class="linie" d="M140 134 L150 150"/>

    <!-- Gepäckträger mit Packtasche -->
    <path class="linie" d="M118 160 h 46"/>
    <rect x="92" y="162" width="48" height="46" rx="7" fill="#3f6b52"/>
    <path d="M92 176 h 48" stroke="#2a4a38" stroke-width="4" fill="none"/>

    <!-- Kurbel und Pedale -->
    <circle cx="172" cy="214" r="12" fill="none" stroke="#2d3b47" stroke-width="5"/>
    <path class="linie" d="M172 214 L186 240"/>
    <rect x="178" y="240" width="20" height="7" rx="3" class="hose"/>
  </g>

  <!-- Der Fahrer -->
  <g>
    <!-- Bein auf der abgewandten Seite: Pedal oben, Knie angewinkelt.
         Etwas dunkler als das vordere, damit die Tiefe stimmt. -->
    <path class="glied" stroke="#24355c" stroke-width="12" d="M138 122 L168 166"/>
    <path class="glied" stroke="#d9b08c" stroke-width="10" d="M168 166 L156 188"/>
    <circle cx="155" cy="191" r="7" fill="#1f2a33"/>

    <!-- Rumpf, vorgebeugt vom Sattel zur Schulter -->
    <path class="trikot" d="M124 130 L150 108 L208 74 L199 104 Z"/>
    <path class="trikot" d="M124 130 q -8 -14 4 -24 l 22 2 Z"/>

    <!-- Bein auf der sichtbaren Seite: Pedal unten -->
    <path class="glied" stroke="#3a56a0" stroke-width="15" d="M144 118 L186 164"/>
    <path class="glied" stroke="#f3cba6" stroke-width="12" d="M186 164 L188 230"/>
    <ellipse cx="190" cy="236" rx="11" ry="7" fill="#1f2a33"/>

    <!-- Arm zum Griff -->
    <path class="glied" stroke="#f6c445" stroke-width="13" d="M200 84 L216 98"/>
    <path class="glied" stroke="#f3cba6" stroke-width="11" d="M216 98 L228 110"/>
    <circle cx="230" cy="112" r="7" class="haut"/>

    <!-- Kopf -->
    <g transform="translate(216 62) rotate(14)">
      <!-- Hals -->
      <path class="haut" d="M-10 16 h 16 v 16 h -16 Z"/>
      <!-- Gesicht -->
      <circle class="haut" cx="0" cy="0" r="26"/>
      <!-- Haare im Nacken -->
      <path class="haar" d="M-26 -2 q -4 16 8 24 q -10 -14 -4 -26 Z"/>
      <!-- Helm -->
      <path class="helm" d="M-27 -4 a 27 27 0 0 1 54 0 q -14 -8 -27 -8 q -13 0 -27 8 Z"/>
      <path class="helm" d="M-28 -4 h 56 a 4 4 0 0 1 0 8 h -56 a 4 4 0 0 1 0 -8 Z"/>
      <!-- Helmschlitze -->
      <g stroke="#a60b14" stroke-width="3" fill="none">
        <path d="M-14 -18 l 4 -8"/><path d="M0 -22 v -8"/><path d="M14 -18 l -4 -8"/>
      </g>
      <!-- Brille -->
      <g fill="#2d3b47">
        <rect x="2" y="-6" width="22" height="12" rx="6"/>
        <rect x="-20" y="-6" width="18" height="12" rx="6"/>
        <rect x="-3" y="-3" width="6" height="3"/>
      </g>
      <!-- Grinsen -->
      <path d="M4 12 q 10 8 18 -2" stroke="#8a5a3b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Wange -->
      <circle cx="20" cy="6" r="5" fill="#e79a86" opacity=".6"/>
    </g>
  </g>
</svg>
